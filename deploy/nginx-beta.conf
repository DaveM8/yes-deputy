# Beta site. Install:
#   sudo cp deploy/nginx-beta.conf /etc/nginx/sites-available/yesdeputy-beta
#   sudo ln -s /etc/nginx/sites-available/yesdeputy-beta /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d beta.yesdeputy.com     # adds HTTPS + HTTP->HTTPS redirect
server {
    listen 80;
    server_name beta.yesdeputy.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Keep the beta site out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE streaming — disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
