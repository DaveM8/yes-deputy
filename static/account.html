<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yes Deputy — Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Yes <span>Deputy</span></div>
    <p class="auth-subtitle">Signed in as <strong id="account-email">…</strong></p>

    <div id="auth-error" class="auth-error"></div>
    <div id="auth-pending" class="auth-pending" style="display:none"></div>

    <section class="account-section">
      <h2>Change password</h2>
      <form class="auth-form" id="password-form">
        <!-- Lets password managers file the new password under the right account -->
        <input type="email" id="username" autocomplete="username" hidden>
        <div>
          <label class="form-label" for="current-password">Current password</label>
          <input class="form-input" id="current-password" type="password"
                 autocomplete="current-password" required>
        </div>
        <div>
          <label class="form-label" for="new-password">New password</label>
          <input class="form-input" id="new-password" type="password"
                 placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div>
          <label class="form-label" for="new-confirm">Confirm new password</label>
          <input class="form-input" id="new-confirm" type="password"
                 autocomplete="new-password" required>
        </div>
        <p class="auth-note">Other devices will be signed out.</p>
        <button class="submit-btn" type="submit">Change password</button>
      </form>
    </section>

    <section class="account-section">
      <h2>Delete account</h2>
      <form class="auth-form" id="delete-form">
        <p class="auth-note">
          Deletes your account and usage history. We'll email you a link to
          confirm; nothing is deleted until you open it.
        </p>
        <div>
          <label class="form-label" for="delete-password">Password</label>
          <input class="form-input" id="delete-password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="submit-btn danger" type="submit">Email me a confirmation link</button>
      </form>
      <p class="auth-note" id="admin-note" hidden>
        Admin accounts can't be deleted here. Use manage.py on the server.
      </p>
    </section>

    <section class="account-section">
      <a class="link-btn" href="/">← Back to search</a>
    </section>
  </div>
</div>

<script>
  const authHeaders = () => ({
    "Content-Type": "application/json",
    "Authorization": "Bearer " + localStorage.getItem("jwt_token"),
  });

  function toLogin() {
    localStorage.removeItem("jwt_token");
    window.location.replace("/login?next=/account");
  }

  function showError(msg) {
    document.getElementById("auth-pending").style.display = "none";
    const el = document.getElementById("auth-error");
    el.textContent = msg;
    el.classList.add("show");
  }

  function showNotice(msg) {
    document.getElementById("auth-error").classList.remove("show");
    const el = document.getElementById("auth-pending");
    el.textContent = msg;
    el.style.display = "block";
  }

  function errorText(data) {
    const d = data && data.detail;
    if (typeof d === "string") return d;
    if (Array.isArray(d) && d.length) return String(d[0].msg || "").replace(/^Value error, /, "");
    if (d && d.message) return d.message;
    return "Something went wrong";
  }

  async function post(url, body, btn) {
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Please wait…";
    try {
      const resp = await fetch(url, { method: "POST", headers: authHeaders(), body: JSON.stringify(body) });
      if (resp.status === 401) { toLogin(); return null; }
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { showError(errorText(data)); return null; }
      return data;
    } catch {
      showError("Network error — please try again");
      return null;
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  (async () => {
    if (!localStorage.getItem("jwt_token")) return toLogin();
    try {
      const resp = await fetch("/api/auth/me", { headers: authHeaders() });
      if (!resp.ok) return toLogin();
      const me = await resp.json();
      document.getElementById("account-email").textContent = me.email;
      document.getElementById("username").value = me.email;
      if (me.is_admin) {
        document.getElementById("delete-form").hidden = true;
        document.getElementById("admin-note").hidden = false;
      }
    } catch {
      showError("Network error — please reload the page");
    }
  })();

  document.getElementById("password-form").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = document.getElementById("new-password").value;
    if (pw !== document.getElementById("new-confirm").value) {
      showError("New passwords do not match");
      return;
    }
    const data = await post("/api/auth/change-password", {
      current_password: document.getElementById("current-password").value,
      new_password: pw,
    }, e.submitter);
    if (!data) return;
    // The old token stopped working with the change; keep this device signed in
    localStorage.setItem("jwt_token", data.token);
    e.target.reset();
    showNotice(data.message);
  });

  document.getElementById("delete-form").addEventListener("submit", async e => {
    e.preventDefault();
    const data = await post("/api/auth/delete-account", {
      password: document.getElementById("delete-password").value,
    }, e.submitter);
    if (!data) return;
    e.target.reset();
    showNotice(data.message);
  });
</script>
</body>
</html>
